{% extends 'base.html' %}
{% block content %}
<h2>Cook Application</h2>
<p class="text-muted">Submit your application to become a verified home cook.</p>
<form method="post" enctype="multipart/form-data" class="mt-3">
  {% csrf_token %}
  {{ form.as_p }}
  <button type="submit" class="btn btn-primary">Submit Application</button>
</form>
{% endblock %}
